apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: filebrowser
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: gru
  sources:
    - repoURL: oci://ghcr.io/softwaredam/helm-charts
      chart: filebrowser-quantum
      targetRevision: "1.5.3-stable-2"
      helm:
        releaseName: filebrowser
        valueFiles:
          - $values/argocd/manifests/prod/apps/filebrowser/values.yaml
    - repoURL: https://github.com/JanBenisek/gru-ops.git
      targetRevision: main
      path: argocd/manifests/prod/apps/filebrowser
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: filebrowser
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
