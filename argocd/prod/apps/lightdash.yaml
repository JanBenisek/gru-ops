apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lightdash
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: gru
  sources:
  - repoURL: https://lightdash.github.io/helm-charts
    chart: lightdash
    targetRevision: "2.16.1459"
    helm:
      valueFiles:
      - $values/argocd/manifests/prod/apps/lightdash/values.yaml
  - repoURL: https://github.com/JanBenisek/gru-ops.git
    targetRevision: main
    path: argocd/manifests/prod/apps/lightdash
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: lightdash
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
