apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ayakaleaf
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: gru
  source:
    repoURL: https://github.com/JanBenisek/gru-ops.git
    targetRevision: main
    path: argocd/manifests/prod/apps/ayakaleaf
  destination:
    server: https://kubernetes.default.svc
    namespace: ayakaleaf
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
