# LAN-only hostnames served by Traefik on the MetalLB VIP 192.168.178.100.
# external-dns does not create records from IngressRoute Host rules in this cluster
# (its traefik-proxy source logs "No endpoints could be generated from Host ..."),
# so the A records are declared here via the crd source. Not proxied, same as metabase.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: lan-coco-in-a-box
  namespace: external-dns
spec:
  endpoints:
    - dnsName: coco-in-a-box.pengiuns.com
      recordType: A
      targets:
        - 192.168.178.100
      providerSpecific:
        - name: external-dns.kubernetes.io/cloudflare-proxied
          value: "false"
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: lan-kitchen-chaos
  namespace: external-dns
spec:
  endpoints:
    - dnsName: kitchen-chaos.pengiuns.com
      recordType: A
      targets:
        - 192.168.178.100
      providerSpecific:
        - name: external-dns.kubernetes.io/cloudflare-proxied
          value: "false"
