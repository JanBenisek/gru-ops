# LAN-only: no external-dns annotations, so no Cloudflare record and no tunnel route.
# Resolve nommer.pengiuns.com to the Traefik LoadBalancer IP on your LAN DNS
# (not in Cloudflare) for it to work.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nommer
  namespace: nommer
  labels:
    app.kubernetes.io/name: nommer
spec:
  ingressClassName: traefik
  rules:
  - host: nommer.pengiuns.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nommer
            port:
              number: 80
  tls:
  - hosts:
      - nommer.pengiuns.com
    secretName: letsencrypt-wildcard-cert-pengiuns.com-production
