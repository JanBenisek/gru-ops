<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nommer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥣</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>nommer <span aria-hidden="true">🥣</span></h1>
    <p class="subtitle">What did they eat, and when?</p>
  </header>

  <main>
    <section class="controls">
      <form id="add-allergen" class="card-form" autocomplete="off">
        <label for="allergen-name">New food</label>
        <div class="row">
          <input id="allergen-name" name="name" placeholder="e.g. Kiwi" maxlength="40" required>
          <button type="submit">Add food</button>
        </div>
      </form>

      <form id="add-date" class="card-form">
        <label for="day">New day</label>
        <div class="row">
          <input id="day" name="date" type="date" required>
          <button type="submit">Add day</button>
        </div>
      </form>
    </section>

    <p id="status" class="status" role="status" hidden></p>

    <div class="table-wrap">
      <table id="grid" aria-label="Allergens eaten per day"></table>
    </div>
    <p id="empty" class="empty" hidden>No days yet. Add one above to start tracking.</p>
  </main>

  <dialog id="symptom-dialog" aria-labelledby="symptom-title">
    <form id="symptom-form">
      <h2 id="symptom-title"></h2>
      <textarea id="symptom-text" rows="5" maxlength="1000" placeholder="e.g. rash around mouth after dinner"></textarea>
      <div class="dialog-actions">
        <button type="button" id="symptom-clear">Clear</button>
        <button type="button" id="symptom-cancel">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
