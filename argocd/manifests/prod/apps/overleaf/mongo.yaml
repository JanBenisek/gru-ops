# MongoDB required by Overleaf (6.0+ supported, 8.0 recommended)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: overleaf
  labels:
    app: mongo
    app.kubernetes.io/name: mongo
spec:
  serviceName: mongo
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
        app.kubernetes.io/name: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:9.0
        imagePullPolicy: IfNotPresent
        # Overleaf requires transactions, which need a replica set (single-node is enough).
        # One-time manual init after first deploy (as the bitnami/mongodb chart does on fresh installs):
        #   kubectl exec -n overleaf mongo-0 -- mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]})'
        args: ["--replSet", "rs0", "--bind_ip_all"]
        ports:
        - containerPort: 27017
        resources:
          requests:
            memory: "256Mi"
            cpu: "10m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      volumes:
      - name: mongo-data
        persistentVolumeClaim:
          claimName: pvc-mongo
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: overleaf
  labels:
    app.kubernetes.io/name: mongo
spec:
  selector:
    app: mongo
  ports:
  - name: mongo
    port: 27017
    protocol: TCP
    targetPort: 27017
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pvc-mongo
  namespace: overleaf
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  storageClassName: synology-storage-apps
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
