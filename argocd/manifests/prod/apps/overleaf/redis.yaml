# Redis required by Overleaf (6.2+)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: overleaf
  labels:
    app: redis
    app.kubernetes.io/name: redis
spec:
  serviceName: redis
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/name: redis
    spec:
      containers:
      - name: redis
        image: redis:8.10
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: pvc-redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: overleaf
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    protocol: TCP
    targetPort: 6379
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pvc-redis
  namespace: overleaf
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  storageClassName: synology-storage-apps
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
