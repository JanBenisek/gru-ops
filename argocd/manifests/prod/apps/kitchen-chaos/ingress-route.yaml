# LAN-only: no Cloudflare tunnel, no external-dns annotations on the Service.
# Same pattern as metabase, without TinyAuth. TLS uses the wildcard cert reflected into this namespace.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kitchen-chaos
  namespace: games
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kitchen-chaos.pengiuns.com`)
      kind: Rule
      services:
        - name: kitchen-chaos
          port: 80
  tls:
    secretName: letsencrypt-wildcard-cert-pengiuns.com-production
