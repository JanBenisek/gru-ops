apiVersion: v1
kind: Service
metadata:
  name: kitchen-chaos
  namespace: games
  labels:
    app.kubernetes.io/name: kitchen-chaos
spec:
  selector:
    app: kitchen-chaos
  type: ClusterIP
  ports:
  - name: http
    port: 80 # we talk to 80
    protocol: TCP
    targetPort: 8080 # nginx listens here
