apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchen-chaos
  namespace: games
  labels:
    app: kitchen-chaos
    app.kubernetes.io/name: kitchen-chaos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kitchen-chaos
  template:
    metadata:
      labels:
        app: kitchen-chaos
        app.kubernetes.io/name: kitchen-chaos
    spec:
      initContainers:
      - name: fetch-site # copies static files from this repo, no custom image
        image: alpine/git:2.54.0
        command: ["sh", "-c"]
        args:
        - >-
          git clone --depth 1 --branch main https://github.com/JanBenisek/gru-ops.git /tmp/repo &&
          cp -R /tmp/repo/argocd/manifests/prod/apps/kitchen-chaos/site/. /site/
        env:
        - name: HOME
          value: /tmp
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: site
          mountPath: /site
        - name: tmp
          mountPath: /tmp
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.31.7-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080 # unprivileged nginx listens here
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 10
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: tmp
          mountPath: /tmp # nginx pid and temp paths
      volumes:
      - name: site
        emptyDir: {} # no persistent storage, files are re-fetched on pod start
      - name: tmp
        emptyDir: {}
