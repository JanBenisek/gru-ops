# Lightdash - OSS BI tool (experimental)
# https://github.com/lightdash/helm-charts

# Injects LIGHTDASH_SECRET into all pods (signs session cookies, encrypts sensitive data)
existingSecret: lightdash
# Chart renders its own Secret named "lightdash" from `secrets` (default LIGHTDASH_SECRET=changeme),
# which collides with the SealedSecret of the same name. null (not {}: Helm deep-merges maps with defaults)
# drops it; existingSecret still injects the real one.
secrets: null
s3:
  existingSecret: lightdash-s3

# Disable browserless-chrome (only needed for scheduled delivery PDFs/screenshots)
browserless-chrome:
  enabled: false

# LAN-only: no external-dns annotations, so no Cloudflare record and no tunnel route.
# Resolve lightdash.pengiuns.com to the Traefik LoadBalancer IP on your LAN DNS.
configMap:
  # Public URL of the instance (chart default is empty)
  SITE_URL: https://lightdash.pengiuns.com

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: lightdash.pengiuns.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: letsencrypt-wildcard-cert-pengiuns.com-production
      hosts:
        - lightdash.pengiuns.com

resources:
  requests:
    memory: "512Mi"
    cpu: "100m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

# PostgreSQL: external CNPG cluster cnpg-v2 (see argocd/README.md, CNPG section)
postgresql:
  enabled: false

externalDatabase:
  host: vchord-postgres.pengiuns.com
  port: 5432
  user: bot_lightdash
  database: lightdash
  existingSecret: lightdash-postgres
  secretKeys:
    passwordKey: password
