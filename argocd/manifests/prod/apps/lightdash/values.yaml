# Lightdash - OSS BI tool (experimental, no persistence)
# https://github.com/lightdash/helm-charts

# Injects LIGHTDASH_SECRET into all pods (signs session cookies, encrypts sensitive data)
existingSecret: lightdash
s3:
  existingSecret: lightdash-s3

# Disable browserless-chrome (only needed for scheduled delivery PDFs/screenshots)
browserless-chrome:
  enabled: false

# LAN-only: no external-dns annotations, so no Cloudflare record and no tunnel route.
# Resolve lightdash.pengiuns.com to the Traefik LoadBalancer IP on your LAN DNS.
configMap:
  # Public URL of the instance (chart default is empty)
  SITE_URL: https://lightdash.pengiuns.com

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: lightdash.pengiuns.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: letsencrypt-wildcard-cert-pengiuns.com-production
      hosts:
        - lightdash.pengiuns.com

resources:
  requests:
    memory: "512Mi"
    cpu: "100m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

# Bundled PostgreSQL (bitnami) - ephemeral on purpose, experiment only
postgresql:
  enabled: true
  auth:
    username: lightdash
    database: lightdash
    existingSecret: lightdash-postgres
    secretKeys:
      userPasswordKey: password
  primary:
    persistence:
      enabled: false
    # Chart does not mount a writable volume when persistence is disabled,
    # so provide an emptyDir for /bitnami/postgresql to keep it ephemeral.
    extraVolumes:
      - name: bitnami-data
        emptyDir: {}
    extraVolumeMounts:
      - name: bitnami-data
        mountPath: /bitnami/postgresql
    resources:
      requests:
        memory: "256Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
