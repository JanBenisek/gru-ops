# Lightdash - OSS BI tool (experimental, no persistence)
# https://github.com/lightdash/helm-charts

# Injects LIGHTDASH_SECRET into all pods (signs session cookies, encrypts sensitive data)
existingSecret: lightdash
s3:
  existingSecret: lightdash-s3

# Disable browserless-chrome (only needed for scheduled delivery PDFs/screenshots)
browserless-chrome:
  enabled: false

resources:
  requests:
    memory: "512Mi"
    cpu: "100m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

# Bundled PostgreSQL (bitnami) - ephemeral on purpose, experiment only
postgresql:
  enabled: true
  auth:
    username: lightdash
    database: lightdash
    existingSecret: lightdash-postgres
    secretKeys:
      userPasswordKey: password
  primary:
    persistence:
      enabled: false
    # Chart does not mount a writable volume when persistence is disabled,
    # so provide an emptyDir for /bitnami/postgresql to keep it ephemeral.
    extraVolumes:
      - name: bitnami-data
        emptyDir: {}
    extraVolumeMounts:
      - name: bitnami-data
        mountPath: /bitnami/postgresql
    resources:
      requests:
        memory: "256Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
