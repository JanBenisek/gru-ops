apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-snapotter-data
  namespace: snapotter
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  storageClassName: synology-storage-apps
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-snapotter-workspace
  namespace: snapotter
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  storageClassName: synology-storage-ephemeral
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
