apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapotter
  namespace: snapotter
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app: snapotter
    app.kubernetes.io/name: snapotter
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: snapotter
  template:
    metadata:
      labels:
        app: snapotter
        app.kubernetes.io/name: snapotter
    spec:
      containers:
        - name: snapotter
          image: snapotter/snapotter:1.15.11
          imagePullPolicy: IfNotPresent
          env:
            # --- Authentication ---
            - name: AUTH_ENABLED
              value: "true"
            - name: DEFAULT_USERNAME
              value: "admin"
            - name: DEFAULT_PASSWORD
              value: "admin"
            # --- Networking ---
            - name: TRUST_PROXY
              value: "true"
            # --- Limits ---
            - name: MAX_UPLOAD_SIZE_MB
              value: "200"
            - name: CONCURRENT_JOBS
              value: "4"
            - name: FILE_MAX_AGE_HOURS
              value: "12"
            # --- UI Settings ---
            - name: APP_NAME
              value: "snapotter"
            - name: DEFAULT_THEME
              value: "light"
            - name: DEFAULT_LOCALE
              value: "en"

          ports:
            - containerPort: 1349
              name: http

          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              cpu: "2000m"
              memory: "4Gi"

          volumeMounts:
            - name: snapotter-data
              mountPath: /data
            - name: snapotter-workspace
              mountPath: /tmp/workspace

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 1349
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: snapotter-data
          persistentVolumeClaim:
            claimName: pvc-snapotter-data
        - name: snapotter-workspace
          persistentVolumeClaim:
            claimName: pvc-snapotter-workspace
