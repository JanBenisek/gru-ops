apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ayakaleaf
  namespace: ayakaleaf
  labels:
    app: ayakaleaf
    app.kubernetes.io/name: ayakaleaf
  annotations:
    traefik.ingress.kubernetes.io/max-body-size: "50M"
    traefik.ingress.kubernetes.io/readtimeout: "1000s"
    traefik.ingress.kubernetes.io/writetimeout: "1000s"
    traefik.ingress.kubernetes.io/idletimeout: "1000s"
spec:
  ingressClassName: traefik
  rules:
  - host: ayakaleaf.pengiuns.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ayakaleaf
            port:
              number: 80
  tls:
  - hosts:
      - ayakaleaf.pengiuns.com
    secretName: letsencrypt-wildcard-cert-pengiuns.com-production
