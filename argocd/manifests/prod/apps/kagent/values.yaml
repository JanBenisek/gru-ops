# kagent chart 0.10.3 values
# Anthropic key comes from sealed secret kagent-anthropic (see manifests/)
controller:
  auth:
    # No auth in front of the UI; reachable from the LAN only
    mode: unsecure

providers:
  default: anthropic
  anthropic:
    model: "claude-haiku-4-5"
    apiKeySecretRef: kagent-anthropic
    apiKeySecretKey: ANTHROPIC_API_KEY

ui:
  # OpenShift Route is not used on Talos/Traefik; routed via manifests/ingress.yaml
  route:
    enabled: false

# Keep only the general k8s agent; chart enables all bundled agents by default
kgateway-agent:
  enabled: false
istio-agent:
  enabled: false
promql-agent:
  enabled: false
observability-agent:
  enabled: false
argo-rollouts-agent:
  enabled: false
helm-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-debug-agent:
  enabled: false

# One login (bot_kagent) owns its database and runs both migrations and runtime queries.
config:
  database:
    owner:
      role: bot_kagent
    readWrite:
      role: bot_kagent
