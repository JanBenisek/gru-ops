# kagent chart 0.10.3 values
# Anthropic key comes from sealed secret kagent-anthropic (see manifests/)
controller:
  auth:
    # No auth in front of the UI; reachable from the LAN only
    mode: unsecure

providers:
  default: anthropic
  anthropic:
    model: "claude-haiku-4-5"
    apiKeySecretRef: kagent-anthropic
    apiKeySecretKey: ANTHROPIC_API_KEY

ui:
  # OpenShift Route is not used on Talos/Traefik; routed via manifests/ingress.yaml
  route:
    enabled: false

database:
  postgres:
    bundled:
      # Synology CSI rejects volumes under 1Gi (chart default is 500Mi)
      storage: 1Gi
      # Cluster has no default StorageClass; PVC stays Pending without this
      storageClassName: synology-storage-apps
