# TLS terminates at Cloudflare Tunnel, traffic reaches Traefik on web (:80)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kagent
  namespace: kagent
  labels:
    tinyauth.apps.kagent.oauth.groups: family
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`kagent.pengiuns.com`)
      kind: Rule
      middlewares:
        - name: tinyauth
          namespace: kagent
      services:
        - name: kagent-ui
          port: 8080
