  - kagent-anthropic.yaml
  - kagent-github-auth.yaml
  - kagent-github-mcp.yaml
  - kagent-github-token.yaml
  - my-first-k8s-agent.yaml
  - opencode-model-config.yaml
  - repo-worker.yaml
configurations:
  - image-fields.yaml
