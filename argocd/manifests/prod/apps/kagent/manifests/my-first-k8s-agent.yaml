apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: my-first-k8s-agent
  namespace: kagent
spec:
  declarative:
    modelConfig: opencode-go
    runtime: go
    stream: true
    systemMessage: |-
      You're a friendly and helpful agent that uses Kubernetes tools to answer users questions about the cluster.

      # Instructions
      - If user question is unclear, ask for clarification before running any tools
      - Always be helpful and friendly
      - If you don't know how to answer the question DO NOT make things up
        respond with "Sorry, I don't know how to answer that" and ask the user to further clarify the question
        If you are unable to help, or something goes wrong, refer the user to https://kagent.dev for more information or support.

      # Response format
      - ALWAYS format your response as Markdown
      - Your response will include a summary of actions you took and an explanation of the result
    tools:
    - mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: kagent-tool-server
        namespace: kagent
        toolNames:
        - k8s_get_available_api_resources
      type: McpServer
    - mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: kagent-tool-server
        namespace: kagent
        toolNames:
        - k8s_get_resources
      type: McpServer
    - mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: kagent-github-mcp
        namespace: kagent
        toolNames:
        - get_file_contents
        - list_branches
        - create_branch
        - create_or_update_file
        - push_files
        - list_pull_requests
        - pull_request_read
        - create_pull_request
      type: McpServer
  description: This agent can interact with the Kubernetes API to get information about the cluster.
  type: Declarative
