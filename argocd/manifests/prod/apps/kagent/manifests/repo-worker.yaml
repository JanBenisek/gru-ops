apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: repo-worker
  namespace: kagent
spec:
  description: Clones a GitHub repo, makes changes, runs its checks, opens a PR after human approval
  type: BYO
  byo:
    deployment:
      image: docker-registry.pengiuns.com/kagent-worker:0.1.0
      imagePullPolicy: IfNotPresent
      replicas: 1
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      env:
        - name: GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: kagent-github-token
              key: GITHUB_TOKEN
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: kagent-anthropic
              key: ANTHROPIC_API_KEY
        - name: ANTHROPIC_BASE_URL
          value: https://opencode.ai/inference/go/anthropic
        - name: MODEL
          value: claude-haiku-5-5
        - name: PUBLIC_URL
          value: http://repo-worker.kagent:8080/
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 4Gi
