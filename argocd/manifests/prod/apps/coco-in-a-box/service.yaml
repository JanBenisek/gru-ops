apiVersion: v1
kind: Service
metadata:
  name: coco-in-a-box
  namespace: games
  labels:
    app.kubernetes.io/name: coco-in-a-box
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "300"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/hostname: coco-in-a-box.pengiuns.com
    external-dns.alpha.kubernetes.io/target: d65bf19e-11ed-4df3-81c1-b76923b14de4.cfargotunnel.com
spec:
  selector:
    app: coco-in-a-box
  type: ClusterIP
  ports:
  - name: http
    port: 80 # we talk to 80
    protocol: TCP
    targetPort: 8080 # nginx listens here
