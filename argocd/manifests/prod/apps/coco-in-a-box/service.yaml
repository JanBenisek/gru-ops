apiVersion: v1
kind: Service
metadata:
  name: coco-in-a-box
  namespace: games
  labels:
    app.kubernetes.io/name: coco-in-a-box
spec:
  selector:
    app: coco-in-a-box
  type: ClusterIP
  ports:
  - name: http
    port: 80 # we talk to 80
    protocol: TCP
    targetPort: 8080 # nginx listens here
