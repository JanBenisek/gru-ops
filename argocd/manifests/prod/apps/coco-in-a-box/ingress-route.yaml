# Replaces ingress.yaml. Cloudflare Tunnel sends to traefik:80, so use the web entrypoint.
# TLS terminates at Cloudflare.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: coco-in-a-box
  namespace: games
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`coco-in-a-box.pengiuns.com`)
      kind: Rule
      middlewares:
        - name: coco-in-a-box-basic-auth
      services:
        - name: coco-in-a-box
          port: 80
