apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyoffice
  namespace: onlyoffice
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app: onlyoffice
    app.kubernetes.io/name: onlyoffice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onlyoffice
  template:
    metadata:
      labels:
        app: onlyoffice
        app.kubernetes.io/name: onlyoffice
    spec:
      containers:
        - name: onlyoffice
          image: onlyoffice/documentserver:9.3
          imagePullPolicy: IfNotPresent
          env:
            # Handy for debugging
            # - name: DS_LOG_LEVEL
              # value: DEBUG
            # JWT configuration - must match Filebrowser secret
            - name: JWT_SECRET
              value: "filebrowser-onlyoffice-integration"
            - name: JWT_ENABLED
              value: "true"
            - name: JWT_HEADER
              value: "Authorization"
            - name: WOPI_ENABLED
              value: "true"
            - name: ALLOW_PRIVATE_IP_ADDRESS
            # External PostgreSQL (CNPG) connection
            - name: DB_TYPE
              value: "postgres"
            - name: DB_HOST
              value: "vchord-postgres.pengiuns.com"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "onlyoffice"
            - name: DB_USER
              value: "bot_onlyoffice"
            - name: DB_PWD
              valueFrom:
                secretKeyRef:
                  name: bot-onlyoffice-pswd
                  key: password
            # Filebrowser integration - OnlyOffice needs to know where Filebrowser is
            - name: SERVER_EXTERNAL_URL
              value: "http://filebrowser-filebrowser-quantum.filebrowser.svc.cluster.local:8080"
          ports:
            - containerPort: 80
            - containerPort: 443
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            - mountPath: /var/log/onlyoffice
              name: logs
            - mountPath: /var/www/onlyoffice/Data
              name: data
            - mountPath: /var/lib/onlyoffice
              name: lib
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: pvc-logs
        - name: data
          persistentVolumeClaim:
            claimName: pvc-data
        - name: lib
          persistentVolumeClaim:
            claimName: pvc-lib
