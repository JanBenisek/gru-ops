apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onlyoffice
  namespace: onlyoffice
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/max-body-size: "100M"
    traefik.ingress.kubernetes.io/readtimeout: "900"
    traefik.ingress.kubernetes.io/writetimeout: "900"
    traefik.ingress.kubernetes.io/idletimeout: "900"
    # Forward HTTPS protocol and host to OnlyOffice so it generates HTTPS URLs
    traefik.ingress.kubernetes.io/headers.customrequestheaders.X-Forwarded-Proto: "https"
    traefik.ingress.kubernetes.io/headers.customrequestheaders.X-Forwarded-Host: "onlyoffice.pengiuns.com"
    traefik.ingress.kubernetes.io/headers.customrequestheaders.X-Forwarded-Port: "443"
    traefik.ingress.kubernetes.io/headers.sslproxyheaders.X-Forwarded-Proto: "https"

spec:
  ingressClassName: traefik
  rules:
    - host: onlyoffice.pengiuns.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: onlyoffice
                port:
                  number: 80
  tls:
    - hosts:
        - onlyoffice.pengiuns.com
      secretName: letsencrypt-wildcard-cert-pengiuns.com-production
