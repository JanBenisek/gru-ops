# Only deltas from the filebrowser-quantum chart defaults are pinned here.
# Chart: oci://ghcr.io/softwaredam/helm-charts/filebrowser-quantum (version pinned in argocd/prod/apps/filebrowser.yaml)
# Chart reference: https://github.com/Softwaredam/filebrowser-chart
# The image and app config intentionally use the chart defaults (filebrowser v1 line). Do NOT add
# an image.tag override here: Renovate's helm-values manager would auto-bump it to v2 again, whose
# strict config decoding rejects this chart's v1-era defaults (that is what broke the pod in Aug 2026).
# The chart's default database path (/home/filebrowser/data/database.db) reuses the existing bolt DB
# on the config PVC, so users and settings from before the v2 attempt come back.
ingress:
  enabled: true
  class: traefik
  host: filebrowser.pengiuns.com
  certSecret: letsencrypt-wildcard-cert-pengiuns.com-production
  annotations:
    traefik.ingress.kubernetes.io/max-body-size: "0"

# The chart names PVCs <release>-filebrowser-quantum-{data,config}, same as the old vendored chart,
# so the existing data and database PVCs are reused as-is. k8up annotations keep the NAS backups working.
persistence:
  enabled: true
  keep: true
  storageClass: synology-storage-apps
  accessMode: ReadWriteOnce
  data:
    size: 100Gi
    annotations:
      k8up.io/backup: "true"
  config:
    size: 5Gi
    annotations:
      k8up.io/backup: "true"

# Secrets come from sealed secrets in this directory. Env vars override the matching config keys,
# and env entries take precedence over the chart-generated secret (envFrom).
extraEnv:
  - name: FILEBROWSER_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: filebrowser-admin
        key: password
  - name: FILEBROWSER_ONLYOFFICE_SECRET
    valueFrom:
      secretKeyRef:
        name: filebrowser-jwt-token
        key: SECRET
  - name: FILEBROWSER_OIDC_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: filebrowser-oidc-client
        key: id
  - name: FILEBROWSER_OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: filebrowser-oidc-client
        key: secret

config:
  server:
    externalUrl: "https://filebrowser.pengiuns.com"
    maxArchiveSize: 50 # upstream default dropped to 20, keeping the previous limit
  auth:
    methods:
      password:
        enabled: false # OIDC-only login
      oidc:
        enabled: true
        issuerUrl: "https://pocket-id.pengiuns.com"
        scopes: "email openid profile groups" # groups scope is required for adminGroup below
        createUser: true
        adminGroup: "admin"
  integrations:
    office:
      url: "https://onlyoffice.pengiuns.com" # JWT secret comes from the FILEBROWSER_ONLYOFFICE_SECRET env
